<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Sea Glass Heaven</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2A5360',
                        secondary: '#04757B',
                        accent: '#53ABA9',
                        bgcustom: '#EADBD4',
                    },
                    fontFamily: {
                        'heading': ['Poppins', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="font-body bg-bgcustom text-gray-800 min-h-screen flex flex-col">
    <custom-navbar></custom-navbar>
    <chat-bot-icon></chat-bot-icon>

    <!-- Register Section -->
    <section class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="w-full max-w-lg">
            <div class="bg-white rounded-2xl custom-shadow p-8">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-accent/20 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-feather="user-plus" class="text-accent w-8 h-8"></i>
                    </div>
                    <h1 class="font-heading text-2xl font-bold text-primary mb-2">Create Your Account</h1>
                    <p class="text-gray-600">Join Sea Glass Heaven for an enhanced stay experience</p>
                </div>

                <form id="registerForm" class="space-y-5">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                            <input type="text" id="firstName" name="firstName" required
                                class="input-field" placeholder="John">
                        </div>
                        <div>
                            <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                            <input type="text" id="lastName" name="lastName" required
                                class="input-field" placeholder="Doe">
                        </div>
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                        <div class="relative">
                            <i data-feather="mail" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                            <input type="email" id="email" name="email" required
                                class="input-field pl-10" placeholder="your@email.com">
                        </div>
                    </div>

                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                        <div class="relative">
                            <i data-feather="phone" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                            <input type="tel" id="phone" name="phone" required
                                class="input-field pl-10" placeholder="+1 (555) 123-4567">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <div class="relative">
                            <i data-feather="lock" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                            <input type="password" id="password" name="password" required
                                class="input-field pl-10" placeholder="Create a strong password">
                        </div>
                        <div class="mt-2 grid grid-cols-4 gap-1">
                            <div class="h-1 bg-gray-200 rounded" id="strength1"></div>
                            <div class="h-1 bg-gray-200 rounded" id="strength2"></div>
                            <div class="h-1 bg-gray-200 rounded" id="strength3"></div>
                            <div class="h-1 bg-gray-200 rounded" id="strength4"></div>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">Use 8+ characters, mix of letters, numbers & symbols</p>
                    </div>

                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                        <div class="relative">
                            <i data-feather="lock" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                            <input type="password" id="confirmPassword" name="confirmPassword" required
                                class="input-field pl-10" placeholder="Confirm your password">
                        </div>
                    </div>

                    <div class="space-y-3">
                        <label class="flex items-start">
                            <input type="checkbox" class="rounded border-gray-300 text-accent focus:ring-accent mt-1" required>
                            <span class="ml-2 text-sm text-gray-600">I agree to the <a href="#" class="text-secondary hover:underline">Terms of Service</a> and <a href="#" class="text-secondary hover:underline">Privacy Policy</a></span>
                        </label>
                        <label class="flex items-start">
                            <input type="checkbox" class="rounded border-gray-300 text-accent focus:ring-accent mt-1">
                            <span class="ml-2 text-sm text-gray-600">Send me exclusive offers and promotions via email</span>
                        </label>
                    </div>

                    <button type="submit" class="btn-accent w-full flex items-center justify-center gap-2">
                        <i data-feather="user-plus" class="w-5 h-5"></i>
                        Create Account
                    </button>
                </form>

                <div class="mt-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white text-gray-500">Or sign up with</span>
                        </div>
                    </div>

                    <div class="mt-6 grid grid-cols-2 gap-4">
                        <button class="flex items-center justify-center gap-2 py-3 px-4 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                            <svg class="w-5 h-5" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            Google
                        </button>
                        <button class="flex items-center justify-center gap-2 py-3 px-4 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                            <i data-feather="facebook" class="w-5 h-5 text-blue-600"></i>
                            Facebook
                        </button>
                    </div>
                </div>

                <p class="mt-8 text-center text-sm text-gray-600">
                    Already have an account? 
                    <a href="login.html" class="text-secondary hover:text-primary font-medium">Sign in here</a>
                </p>
            </div>
        </div>
    </section>

    <custom-footer></custom-footer>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="components/chatbot-icon.js"></script>
    <script src="script.js"></script>
    <script>
        feather.replace();

        // Password strength indicator
        document.getElementById('password').addEventListener('input', function(e) {
            const password = e.target.value;
            let strength = 0;
            
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            
            const colors = ['bg-red-500', 'bg-yellow-500', 'bg-blue-500', 'bg-green-500'];
            
            for (let i = 1; i <= 4; i++) {
                const bar = document.getElementById('strength' + i);
                bar.className = 'h-1 rounded ' + (i <= strength ? colors[strength - 1] : 'bg-gray-200');
            }
        });

        // Form submission
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }
            
            alert('Account created successfully! Redirecting to login...');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
